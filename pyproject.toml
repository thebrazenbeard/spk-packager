[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spk-packager"
version = "0.1.0"
description = "Deterministic Synology DSM 7.2.2+ SPK scaffolding, packaging, linting, and verification."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Patrick Sims"}]
dependencies = []

[project.scripts]
spk-packager = "spk_packager.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
